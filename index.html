<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite One Squad | Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-grid"></div>

    <!-- LOADING PAGE -->
    <div id="loader">
        <div class="loader-text">ELITE<span>ONE</span></div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container" id="main-content">
        
        <div class="header">
            <h1>Elite <span>One</span> Squad</h1>
        </div>

        <!-- KARTU 3D MAGNETIK -->
        <div class="profile-card" id="magnetic-card">
            
            <div class="profile-content">
                
                <!-- AREA GAMBAR: Avatar -->
                <div class="avatar-wrapper">
                    <img src="assets/avatar.png" class="avatar-img" alt="Avatar">
                </div>

                <!-- INFO LIST LIQUID 3D -->
                <div class="info-list">
                    <!-- Item IDZ -->
                    <div class="info-item liquid-item copy-item" onclick="copyID()" style="--x: 0; --y: 0;">
                        <div class="liquid-bg"></div> <!-- Efek Liquid -->
                        <div class="content-3d">
                            <span class="info-label">IDZ <span class="copy-text">(tap to copy)</span></span>
                            <span class="info-value" id="id-text">xfouırld07</span>
                        </div>
                    </div>
                    
                    <!-- Item Role -->
                    <div class="info-item liquid-item" style="--x: 0; --y: 0;">
                        <div class="liquid-bg"></div>
                        <div class="content-3d">
                            <span class="info-label">ROLE</span>
                            <span class="info-value">Kang DC</span>
                        </div>
                    </div>
                    
                    <!-- Item User -->
                    <div class="info-item liquid-item" style="--x: 0; --y: 0;">
                        <div class="liquid-bg"></div>
                        <div class="content-3d">
                            <span class="info-label">USER</span>
                            <span class="info-value">Mod</span>
                        </div>
                    </div>
                    
                    <!-- Item Map -->
                    <div class="info-item liquid-item" style="--x: 0; --y: 0;">
                        <div class="liquid-bg"></div>
                        <div class="content-3d">
                            <span class="info-label">FAVORIT MAP</span>
                            <span class="info-value"></span> 
                        </div>
                    </div>
                </div>

            </div>

            <!-- TOMBOL -->
            <div class="button-group">
                <div class="img-buttons">
                    <a href="assets/garwed.jpg" target="_blank" class="btn-img-card">
                        <img src="assets/garwed.jpg" alt="Garwed">
                    </a>
                    <a href="assets/bukit.jpg" target="_blank" class="btn-img-card">
                        <img src="assets/bukit.jpg" alt="Bukit">
                    </a>
                </div>

                <a href="https://discord.gg/yourlink" target="_blank" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
                    Join Discord
                </a>
            </div>

        </div>

        <div class="footer">
            &copy; 2024 Elite One Squad.
        </div>
    </div>

    <!-- SCRIPT UNTUK 3D MAGNETIK & COPY -->
    <script>
        // 1. Fitur Copy ID
        function copyID() {
            var idText = document.getElementById("id-text").innerText;
            navigator.clipboard.writeText(idText).then(function() {
                var label = document.querySelector(".copy-text");
                var originalText = label.innerText;
                label.innerText = "(Copied!)";
                label.style.color = "#fff";
                setTimeout(function() {
                    label.innerText = originalText;
                    label.style.color = "";
                }, 2000);
            });
        }

        // 2. Fitur 3D Magnetik pada Kartu Utama
        const card = document.getElementById('magnetic-card');
        
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Balikin ke posisi semula kalau mouse keluar
        document.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
            card.style.transition = "transform 0.5s ease";
        });

        document.addEventListener('mouseenter', () => {
            card.style.transition = "none"; // Hapus transisi pas mouse masuk biar responsif
        });

        // 3. Fitur Liquid 3D pada Menu
        const liquidItems = document.querySelectorAll('.liquid-item');
        
        liquidItems.forEach(item => {
            item.addEventListener('mousemove', (e) => {
                const rect = item.getBoundingClientRect();
                const x = e.clientX - rect.left; // Posisi X kursor di dalam item
                const y = e.clientY - rect.top;  // Posisi Y kursor di dalam item
                
                // Kalkulasi rotasi 3D berdasarkan posisi kursor
                const rotateX = ((y / rect.height) - 0.5) * -20; // Max -10 s/d 10 derajat
                const rotateY = ((x / rect.width) - 0.5) * 20;
                
                // Set variabel CSS untuk background liquid
                item.style.setProperty('--x', `${x}px`);
                item.style.setProperty('--y', `${y}px`);
                
                // Terapkan rotasi 3D
                item.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });

            // Balikin ke posisi semula saat mouse keluar
            item.addEventListener('mouseleave', () => {
                item.style.transform = `perspective(500px) rotateX(0deg) rotateY(0deg) scale(1)`;
                item.style.setProperty('--x', `50%`);
                item.style.setProperty('--y', `50%`);
            });
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
