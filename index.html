<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite One Squad | Bio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font Inter (Teks biasa) & Orbitron (Font Keren Futuristik) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND GRID -->
    <div class="bg-grid"></div>

    <!-- LOADING PAGE -->
    <div id="loader">
        <div class="loader-text">ELITE<span>ONE</span></div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container" id="main-content">
        
        <!-- HEADER -->
        <div class="header">
            <h1 data-text="Elite One Squad">Elite <span>One</span> Squad</h1>
        </div>

        <!-- PROFILE CARD -->
        <div class="profile-card">
            
            <!-- LAYOUT KIRI GAMBAR, KANAN TEKS -->
            <div class="profile-content">
                
                <!-- FOTO PROFILE -->
                <div class="avatar-wrapper">
                    <img src="assets/avatar.png" alt="Profile Avatar">
                </div>

                <!-- INFO LIST -->
                <div class="info-list">
                    <div class="info-item fade-in-up">
                        <span class="info-label">Idz</span>
                        <span class="info-value">xfouırld07</span>
                    </div>
                    <div class="info-item fade-in-up">
                        <span class="info-label">Role</span>
                        <span class="info-value">Kang DC</span>
                    </div>
                    <div class="info-item fade-in-up">
                        <span class="info-label">User</span>
                        <span class="info-value">Mod</span>
                    </div>
                    <!-- Menu Baru: Favorit Map -->
                    <div class="info-item fade-in-up">
                        <span class="info-label">Favorit Map</span>
                        <span class="info-value">Fafotit Map</span>
                    </div>
                </div>

            </div>

            <!-- TOMBOL / LINKS -->
            <div class="button-group">
                
                <!-- Baris 1: Garwed & Bukit (Hanya Gambar, Tanpa Teks) -->
                <div class="img-buttons">
                    <a href="assets/garwed.jpg" target="_blank" class="btn-img-card">
                        <img src="assets/garwed.jpg" alt="Garwed Img">
                    </a>
                    
                    <a href="assets/bukit.jpg" target="_blank" class="btn-img-card">
                        <img src="assets/bukit.jpg" alt="Bukit Img">
                    </a>
                </div>

                <!-- Baris 2: Discord (Full Width) -->
                <a href="https://discord.gg/yourlink" target="_blank" class="btn btn-primary btn-full">

        </div>

        <div class="footer">
